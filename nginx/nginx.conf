# Nginx reverse proxy in front of the Next.js app.
#
# Right now there is one upstream (`app:3000` in docker-compose). To scale to
# multiple replicas (i.e. true L7 load balancing) you only need to:
#   1. Add additional app services to docker-compose (`app2`, `app3`…)
#   2. Add their hostnames to the `upstream ai_news_app` block below.
#   3. Optionally pick a load-balancing algorithm (default is round-robin;
#      `least_conn` is a good default for mixed-latency endpoints).
#
# Nothing else in the app or other services needs to change.

worker_processes auto;
events { worker_connections 1024; }

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout 65;
    server_tokens off;

    # gzip on text-ish responses
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types
        text/plain text/css text/javascript application/javascript
        application/json application/xml application/rss+xml
        application/atom+xml image/svg+xml;

    # Real client IP for downstream logging / rate limiting.
    real_ip_header X-Forwarded-For;
    set_real_ip_from 0.0.0.0/0;

    # Job endpoints get rate-limited per-IP. The auth header is the real gate;
    # this is just a cheap "stop scrapers from probing it" layer.
    limit_req_zone $binary_remote_addr zone=jobs:10m rate=10r/m;

    # ---- Upstream: app replicas ----
    # Add more lines here to scale horizontally. The compose file names a
    # single `app` service today; add `app2`, `app3`, etc. and list them below.
    upstream ai_news_app {
        # Uncomment to switch from round-robin to fewest-in-flight.
        # least_conn;
        server app:3000 max_fails=3 fail_timeout=10s;
        # server app2:3000 max_fails=3 fail_timeout=10s;
        # server app3:3000 max_fails=3 fail_timeout=10s;
        keepalive 32;
    }

    # ---- Server ----
    server {
        listen 80 default_server;
        server_name _;

        # Reasonable timeouts. The /api/jobs/* endpoints can take 60+s during a
        # backfill so we bump proxy_read_timeout for those routes specifically.
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering on;
        proxy_buffer_size 16k;
        proxy_buffers 32 16k;

        # Static Next.js assets — long cache.
        location /_next/static/ {
            proxy_pass http://ai_news_app;
            proxy_cache_valid 200 7d;
            add_header Cache-Control "public, max-age=604800, immutable" always;
        }

        # Background-job endpoints: rate-limit, long read timeout, no client-cached responses.
        location /api/jobs/ {
            limit_req zone=jobs burst=5 nodelay;
            proxy_pass http://ai_news_app;
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
            add_header Cache-Control "no-store" always;
        }

        # Realtime / streaming routes — disable buffering so SSE/WS work.
        location /api/realtime/ {
            proxy_pass http://ai_news_app;
            proxy_buffering off;
            proxy_read_timeout 3600s;
        }

        # Everything else.
        location / {
            proxy_pass http://ai_news_app;
            proxy_read_timeout 60s;
        }
    }
}
