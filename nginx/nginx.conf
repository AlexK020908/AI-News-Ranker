# Nginx reverse proxy + TLS termination in front of the Next.js app.
#
# Architecture:
#   client ──HTTPS──► nginx (this box, :443) ──HTTP──► app (this box, 127.0.0.1:3000)
#
# nginx terminates TLS and forwards plaintext over loopback to the Next.js
# standalone server (systemd unit ai-news-feed-app, see cicd/service_files/).
# The app trusts X-Forwarded-Proto to know the original client scheme, so it
# generates correct https:// URLs and secure cookies even though the proxy
# hop is plain HTTP.
#
# Scaling to multiple replicas:
#   1. Add sibling systemd units listening on 3001, 3002, …
#   2. Add their addresses to the `upstream ai_news_app` block below.
#   3. Optionally pick a load-balancing algorithm (default is round-robin;
#      `least_conn` is a good default for mixed-latency endpoints).
#
# Cert renewal:
#   `certbot-renew.timer` (systemd, ships with certbot) runs twice daily.
#   /etc/letsencrypt/renewal-hooks/deploy/reload-nginx.sh reloads nginx after
#   a successful renewal so the new cert takes effect with no manual step.

worker_processes auto;
events { worker_connections 1024; }

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout 65;
    server_tokens off;

    # gzip on text-ish responses
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types
        text/plain text/css text/javascript application/javascript
        application/json application/xml application/rss+xml
        application/atom+xml image/svg+xml;

    # Real client IP for downstream logging / rate limiting.
    real_ip_header X-Forwarded-For;
    set_real_ip_from 0.0.0.0/0;

    # Job endpoints get rate-limited per-IP. The auth header is the real gate;
    # this is just a cheap "stop scrapers from probing it" layer.
    limit_req_zone $binary_remote_addr zone=jobs:10m rate=10r/m;

    # ---- TLS defaults ----
    # TLS 1.2 + 1.3 only. TLS 1.0/1.1 are PCI-deprecated and have no
    # real-world clients left. Cipher selection delegated to the client per
    # Mozilla intermediate guidance for TLS 1.3.
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # ---- Upstream: app replicas ----
    upstream ai_news_app {
        # Uncomment to switch from round-robin to fewest-in-flight.
        # least_conn;
        server 127.0.0.1:3000 max_fails=3 fail_timeout=10s;
        # server 127.0.0.1:3001 max_fails=3 fail_timeout=10s;
        # server 127.0.0.1:3002 max_fails=3 fail_timeout=10s;
        keepalive 32;
    }

    # ---- Default server: reject mis-pointed traffic ----
    # Anything that didn't ask for stackbrief.tech via Host header / SNI —
    # IP scanners, cert harvesters, parked domains pointed at our IP — gets
    # nothing back.
    #   Port 80:  connection closed with no response (444).
    #   Port 443: TLS handshake refused before any cert is presented, so we
    #             don't leak the real cert via SNI probes.
    server {
        listen 80 default_server;
        listen 443 ssl default_server;
        ssl_reject_handshake on;
        return 444;
    }

    # ---- HTTP server: ACME challenge + redirect to HTTPS ----
    server {
        listen 80;
        server_name stackbrief.tech;

        # Let's Encrypt HTTP-01 challenge stays on plain HTTP so renewals
        # work without depending on the cert that's being renewed.
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
            default_type "text/plain";
        }

        # Everything else permanently redirects to HTTPS.
        location / {
            return 301 https://$host$request_uri;
        }
    }

    # ---- HTTPS server: the real one ----
    server {
        listen 443 ssl http2;
        server_name stackbrief.tech;

        ssl_certificate     /etc/letsencrypt/live/stackbrief.tech/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/stackbrief.tech/privkey.pem;

        # HSTS — tell browsers to use HTTPS only for this host. Disabled
        # initially; enable AFTER you've verified HTTPS works end-to-end for
        # a few days. Start with max-age=86400 (1 day) so a rollback is
        # cheap, then bump to 31536000 (1 year) + preload once confident.
        # add_header Strict-Transport-Security "max-age=86400" always;

        # Reasonable timeouts. The /api/jobs/* endpoints can take 60+s during
        # a backfill so we bump proxy_read_timeout for those routes specifically.
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering on;
        proxy_buffer_size 16k;
        proxy_buffers 32 16k;

        # Static Next.js assets — long cache.
        location /_next/static/ {
            proxy_pass http://ai_news_app;
            proxy_cache_valid 200 7d;
            add_header Cache-Control "public, max-age=604800, immutable" always;
        }

        # Background-job endpoints: rate-limit, long read timeout, no client-cached responses.
        location /api/jobs/ {
            limit_req zone=jobs burst=5 nodelay;
            proxy_pass http://ai_news_app;
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
            add_header Cache-Control "no-store" always;
        }

        # Realtime / streaming routes — disable buffering so SSE/WS work.
        location /api/realtime/ {
            proxy_pass http://ai_news_app;
            proxy_buffering off;
            proxy_read_timeout 3600s;
        }

        # Everything else.
        location / {
            proxy_pass http://ai_news_app;
            proxy_read_timeout 60s;
        }
    }
}
