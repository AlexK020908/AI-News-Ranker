# Single-host POC stack:
#
#   client ──► nginx ──► app (Next.js)
#                          │
#                          ├──► supabase (managed; not in this compose)
#                          ├──► redis (region-keyed listing cache)
#                          └──► s3-compatible bucket (thumbnails — see .env)
#
# `worker` is a separate process that periodically hits the job endpoints
# (replacing scripts/loop.ps1). Same Docker image as `app`; just a different
# command. Keeps app pods stateless and ingest scaling separate.
#
# To go from this POC to a load-balanced setup:
#   - duplicate the `app` service as app2/app3...
#   - add their names to nginx/nginx.conf's `upstream ai_news_app` block.
#   - no other change required.

services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command:
      - redis-server
      - --maxmemory
      - 256mb
      - --maxmemory-policy
      - allkeys-lru
      - --save
      - ""
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env.local
    environment:
      # Inside the docker network — overrides whatever's in .env.local.
      REDIS_URL: redis://redis:6379
    depends_on:
      redis:
        condition: service_healthy
    expose:
      - "3000"

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env.local
    environment:
      REDIS_URL: redis://redis:6379
      WORKER_TARGET: http://app:3000
      WORKER_INTERVAL_SEC: "900"
    depends_on:
      app:
        condition: service_started
      redis:
        condition: service_healthy
    command: ["node", "scripts/worker.mjs"]

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro

volumes:
  redis_data:
